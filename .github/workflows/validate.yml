name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            .editorconfig .gitignore CHANGELOG.md CONTRIBUTING.md LICENSE README.md VERSION
            docs/architecture/CnC-TA-Suite-Architecture.md
            docs/audits/script-pack-audit.md
            docs/development/coding-standards.md
            docs/development/release-process.md
            docs/inventory/script-inventory.csv
            manifest/chrome/manifest.json
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done
      - name: Validate JSON files
        run: |
          python3 -m json.tool manifest/chrome/manifest.json >/dev/null
          python3 -m json.tool docs/inventory/script-inventory.json >/dev/null
          python3 -m json.tool docs/inventory/script-inventory-full.json >/dev/null
